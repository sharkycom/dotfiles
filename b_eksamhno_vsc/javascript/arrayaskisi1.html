<!DOCTYPE html>
<html lang="en">
<body>
  <h1> javascript arrays </h1>
  <p id="demo"></p>
  <script>
    const products = [

{ name: "Laptop", price: 1000 },

{ name: "Mouse", price: 20 },

{ name: "Keyboard", price: 50 }

];
    const names = products.map(function(p) { 
      return p.name; 
    });
    console.log(names);
</script>
</body>
</html>
