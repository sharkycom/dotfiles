<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Παιχνίδι Μάντεψης Αριθμού</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .game-section {
            margin: 20px 0;
        }
        
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .feedback.hidden {
            display: none;
        }
        
        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .feedback.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .feedback.higher {
            background-color: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        
        .stats {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 8px;
            color: #333;
        }
        
        .stats p {
            margin: 5px 0;
            font-size: 16px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Μάντεψε τον Αριθμό</h1>
        <p class="subtitle">Το παιχνίδι σκέφτηκε έναν αριθμό από 1-10</p>
        
        <div class="game-section">
            <input 
                type="number" 
                id="guessInput" 
                min="1" 
                max="10" 
                placeholder="Εισάγετε έναν αριθμό από 1 έως 10"
            >
            <div class="button-group">
                <button onclick="makeGuess()">Μάντεψε</button>
                <button class="reset-btn" onclick="resetGame()">Νέο Παιχνίδι</button>
            </div>
        </div>
        
        <div id="feedback" class="feedback hidden"></div>
        
        <div class="stats">
            <p>Προσπάθειες: <strong id="attempts">0</strong></p>
            <p id="messageText"></p>
        </div>
    </div>

    <script>
        let secretNumber = 0;
        let attempts = 0;
        let gameOver = false;

        // Αρχικοποίηση του παιχνιδιού
        function initGame() {
            secretNumber = Math.floor(Math.random() * 10) + 1;
            attempts = 0;
            gameOver = false;
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').focus();
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('messageText').textContent = '';
        }

        // Λήψη μαντεψιάς
        function makeGuess() {
            if (gameOver) {
                alert('Το παιχνίδι τελείωσε! Κάντε κλικ στο "Νέο Παιχνίδι" για να ξεκινήσετε ξανά.');
                return;
            }

            const guess = parseInt(document.getElementById('guessInput').value);
            const feedbackDiv = document.getElementById('feedback');
            const messageText = document.getElementById('messageText');

            // Επικύρωση εισόδου
            if (isNaN(guess) || guess < 1 || guess > 10) {
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.textContent = '⚠️ Παρακαλώ εισάγετε έναν αριθμό μεταξύ 1 και 10!';
                feedbackDiv.classList.remove('hidden');
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = attempts;
            feedbackDiv.classList.remove('hidden');

            // Έλεγχος της μαντεψιάς
            if (guess === secretNumber) {
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.textContent = `✅ Συγχαρητήρια! Μαντέψατε σωστά! Ο αριθμός ήταν ${secretNumber}`;
                messageText.textContent = `Χρειάστηκαν ${attempts} προσπάθειες!`;
                gameOver = true;
                document.getElementById('guessInput').disabled = true;
            } else if (guess < secretNumber) {
                feedbackDiv.className = 'feedback higher';
                feedbackDiv.textContent = '📈 Ο αριθμός είναι μεγαλύτερος! Δοκιμάστε ξανά.';
            } else {
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.textContent = '📉 Ο αριθμός είναι μικρότερος! Δοκιμάστε ξανά.';
            }

            document.getElementById('guessInput').value = '';
        }

        // Ξεκίνημα νέου παιχνιδιού
        function resetGame() {
            document.getElementById('guessInput').disabled = false;
            initGame();
        }

        // Ενεργοποίηση του Enter πλήκτρου
        document.getElementById('guessInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                makeGuess();
            }
        });

        // Έναρξη του παιχνιδιού κατά τη φόρτωση της σελίδας
        window.onload = initGame;
    </script>
</body>
</html>
