<!DOCTYPE html>
<html lang="en">
<body>
  <h1> javascript arrays </h1>
  <p id="demo"></p>
  <script>
   const products = [

{ name: "Laptop", price: 1000 },
{ name: "Mouse", price: 20 },
{ name: "Keyboard", price: 50 }
];
    const prices = products.map(function(p) { 
      return p.price; 
    });
    console.log(prices);
</script>
</body>
</html>
